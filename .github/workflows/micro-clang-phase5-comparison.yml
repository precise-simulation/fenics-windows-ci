name: micro-clang-phase5-comparison

# Historical qualification workflow retained for reproducibility only.
# Production regression coverage is owned by stack.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: micro-clang-phase5-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison:
    name: Phase 5 paired comparison (Python ${{ matrix.python }})
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download qualified Phase-5 package channel from run 36825854094
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase5-package-channel
          path: phase5-output
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36825854094

      - name: Install micromamba bootstrap
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase5-comparison-bootstrap
          create-args: >-
            -c conda-forge
            python=3.12

      - name: Install paired-comparison environment
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "p5 b py${{ matrix.python }}"
          $channel = "file:///" + ((Resolve-Path phase5-output).Path -replace '\\','/')
          function Install-Comparison {
            & $env:MAMBA_EXE create -y -p $prefix --override-channels --strict-channel-priority -c $channel -c precise-simulation -c conda-forge "python=${{ matrix.python }}" "libblas=*=*openblas" fenics-dolfinx fenics-jit-llvm-mingw fenics-jit-tinycc fenics-jit-micro-clang cffi setuptools | Out-Host
            return $LASTEXITCODE
          }
          $code = Install-Comparison
          if ($code -ne 0) {
            Remove-Item -Recurse -Force $prefix -ErrorAction SilentlyContinue
            & $env:MAMBA_EXE clean --all --yes | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "comparison micromamba cache cleanup failed" }
            $code = Install-Comparison
          }
          if ($code -ne 0) { throw "paired-comparison environment installation failed after retry" }

      - name: Run paired three-backend size and performance comparison
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "p5 b py${{ matrix.python }}"
          $cache = Join-Path $env:RUNNER_TEMP "p5 cache py${{ matrix.python }}"
          $diag = Join-Path $PWD "micro-clang-phase5-comparison-py${{ matrix.python }}"
          Remove-Item -Recurse -Force $cache, $diag -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cache, $diag | Out-Null
          $env:PYTHONHASHSEED = "0"
          $env:PATH = "$prefix;$prefix\Scripts;$prefix\Library\bin;$env:PATH"
          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase5-three-backend-benchmark.py --cache-dir $cache --diagnostics-dir $diag --package-dir (Resolve-Path phase5-output).Path --jit-repeats 5 --runtime-repeats 11
          if ($LASTEXITCODE -ne 0) { throw "Phase-5 paired three-backend comparison failed" }

      - name: Upload paired comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase5-comparison-py${{ matrix.python }}
          path: micro-clang-phase5-comparison-py${{ matrix.python }}/
          if-no-files-found: warn
          retention-days: 30
