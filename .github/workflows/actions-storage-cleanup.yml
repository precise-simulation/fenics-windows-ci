name: actions-storage-cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/actions-storage-cleanup.yml"
      - ".github/workflows/tinycc-jit.yml"
      - "scripts/tinycc-jit/**"
      - "specs/tinycc-ffcx-jit/**"
      - "recipes/fenics-jit-runtime/**"
      - "recipes/fenics-jit-llvm-mingw/**"
      - "recipes/fenics-jit-tinycc/**"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Reclaim stale transfer artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete stale TinyCC transfer artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          cutoff = datetime.now(timezone.utc) - timedelta(hours=6)
          transient_names = {
              "tinycc-development-stage",
              "tinycc-phase3-package",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "fenics-windows-ci-actions-storage-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API GET failed ({exc.code}): {detail}") from exc

          artifacts: list[dict[str, object]] = []
          page = 1
          while True:
              payload = request_json(
                  f"https://api.github.com/repos/{repository}/actions/artifacts"
                  f"?per_page=100&page={page}"
              )
              batch = payload.get("artifacts")
              if not isinstance(batch, list):
                  raise RuntimeError(f"unexpected artifacts response: {payload!r}")
              artifacts.extend(item for item in batch if isinstance(item, dict))
              if len(batch) < 100:
                  break
              page += 1

          total_bytes = sum(int(item.get("size_in_bytes", 0)) for item in artifacts)
          candidates: list[dict[str, object]] = []
          for artifact in artifacts:
              if artifact.get("expired"):
                  continue
              if artifact.get("name") not in transient_names:
                  continue
              created_at = artifact.get("created_at")
              if not isinstance(created_at, str):
                  raise RuntimeError(f"artifact has no creation time: {artifact!r}")
              created = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              if created <= cutoff:
                  candidates.append(artifact)

          freed_bytes = 0
          for artifact in candidates:
              artifact_id = artifact.get("id")
              if not isinstance(artifact_id, int):
                  raise RuntimeError(f"artifact has no numeric id: {artifact!r}")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError(
                              f"unexpected delete status {response.status} for artifact {artifact_id}"
                          )
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API DELETE failed for artifact {artifact_id} "
                      f"({exc.code}): {detail}"
                  ) from exc
              size = int(artifact.get("size_in_bytes", 0))
              freed_bytes += size
              print(
                  f"deleted {artifact.get('name')} id={artifact_id} "
                  f"size={size / (1024 * 1024):.2f} MiB"
              )

          print(
              f"repository artifacts before cleanup: {len(artifacts)} artifacts, "
              f"{total_bytes / (1024 * 1024):.2f} MiB"
          )
          print(
              f"cleanup deleted {len(candidates)} stale transfer artifacts, "
              f"reclaiming {freed_bytes / (1024 * 1024):.2f} MiB"
          )
          PY
