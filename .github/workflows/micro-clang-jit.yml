          name: micro-clang-phase4-stage3-package
          path: micro clang phase4 stage3 package artifact with spaces

      - name: Download Phase-0 reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase0-reference
          path: micro-clang-phase0-reference

      - name: Install micromamba bootstrap
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase4-stage3-bootstrap
          create-args: >-
            -c conda-forge
            python=3.12

      - name: Install isolated FEniCS runtime in a spaced prefix
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase4 stage3 python py${{ matrix.python }} with spaces"
          & $env:MAMBA_EXE create -y -p $prefix --override-channels --strict-channel-priority -c precise-simulation -c conda-forge "python=${{ matrix.python }}" "libblas=*=*openblas" fenics-jit-llvm-mingw fenics-dolfinx cffi setuptools pefile
          if ($LASTEXITCODE -ne 0) { throw "Phase-4 stage-3 FEniCS environment installation failed" }
          $artifactBackend = Join-Path $PWD "micro clang phase4 stage3 package artifact with spaces\Library\fenics-jit\backends\micro-clang"
          $backend = Join-Path $prefix "Library\fenics-jit\backends\micro-clang"
          New-Item -ItemType Directory -Force (Split-Path -Parent $backend) | Out-Null
          Remove-Item -Recurse -Force $backend -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $artifactBackend -Destination $backend -Recurse -Force

      - name: Re-run ABI, driver, PE and hermeticity contract
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase4 stage3 python py${{ matrix.python }} with spaces"
          $backend = Join-Path $prefix "Library\fenics-jit\backends\micro-clang"
          $reference = (Resolve-Path "micro-clang-phase0-reference/driver-evidence.json").Path
          ./scripts/micro-clang-jit/run-phase1.ps1 -PythonPrefix $prefix -ToolchainRoot $backend -ReferenceDriver $reference -WorkDir "micro clang phase4 stage3 contract py${{ matrix.python }} with spaces" -DiagnosticsDir "micro-clang-phase4-stage3-py${{ matrix.python }}/phase1-regression"

      - name: Run complete private broad qualification with closure tracing
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase4 stage3 python py${{ matrix.python }} with spaces"
          $backend = Join-Path $prefix "Library\fenics-jit\backends\micro-clang"
          $diag = Join-Path $PWD "micro-clang-phase4-stage3-py${{ matrix.python }}"
          $env:PYTHONHASHSEED = "0"
          $env:PATH = "$prefix;$prefix\Scripts;$prefix\Library\bin;$env:PATH"
          $env:FENICS_JIT_MEASURE_CLOSURE = "1"
          $env:FENICS_JIT_MEASURE_DIR = Join-Path $diag "closure-traces"
          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase3-private-validation.py --backend-root $backend --work-dir "micro clang phase4 stage3 work py${{ matrix.python }} with spaces" --diagnostics-dir $diag
          if ($LASTEXITCODE -ne 0) { throw "Phase-4 stage-3 private qualification failed" }

      - name: Upload Phase-4 stage-3 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage3-py${{ matrix.python }}
          path: micro-clang-phase4-stage3-py${{ matrix.python }}/
          if-no-files-found: warn
          retention-days: 14
