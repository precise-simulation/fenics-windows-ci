name: micro-clang-phase4-stage7-downstream

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: micro-clang-phase4-stage7-downstream-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PACKAGE_FILE: "fenics-jit-micro-clang-20260826-h9490d1a_1.conda"
  BASE_PACKAGE_SHA256: "d8a3510eb08615cb890dbf8f6da8b0d26f573e16a7b0bbee657edf563d40ad01"
  BASE_PACKAGE_BYTES: "31890069"
  BASE_PACKAGE_URL: "https://api.anaconda.org/download/precise-simulation/fenics-jit-micro-clang/20260826/win-64/fenics-jit-micro-clang-20260826-h9490d1a_1.conda"
  BASE_QUALIFICATION_RUN_ID: "37100978194"
  BASE_QUALIFICATION_HEAD: "dbcc097f2a1084d89b92b280c96d98dc5a7f8a9d"

jobs:
  repackage:
    name: Stage 7 build Full-LTO backend package channel
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install package build tooling
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-stage7-package-tools
          create-args: >-
            -c conda-forge
            python=3.12
            rattler-build=0.74.0

      - name: Verify exact published Stage-7 base package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force base-package | Out-Null
          $package = Join-Path $PWD "base-package/$env:BASE_PACKAGE_FILE"
          Invoke-WebRequest -Uri $env:BASE_PACKAGE_URL -OutFile $package -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $package).Length
          if ($hash -ne $env:BASE_PACKAGE_SHA256) { throw "published Stage-7 base package SHA-256 mismatch: $hash" }
          if ($bytes -ne [int64]$env:BASE_PACKAGE_BYTES) { throw "published Stage-7 base package size mismatch: $bytes" }
          [pscustomobject]@{
            package = $env:BASE_PACKAGE_FILE
            sha256 = $hash
            bytes = $bytes
            qualification_run = [int64]$env:BASE_QUALIFICATION_RUN_ID
            qualification_head = $env:BASE_QUALIFICATION_HEAD
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 base-package.json

      - name: Stage Stage-7 backend source and refresh package identity
        shell: pwsh
        run: |
          $sourcePrefix = Join-Path $env:RUNNER_TEMP "stage7 published build1 source"
          Remove-Item -Recurse -Force $sourcePrefix -ErrorAction SilentlyContinue
          & $env:MAMBA_EXE create -y -p $sourcePrefix --override-channels --strict-channel-priority -c precise-simulation -c conda-forge "python=3.12.*" "fenics-jit-micro-clang=20260826=h9490d1a_1" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "could not install exact published Stage-7 base package" }
          $recordPath = Get-ChildItem -LiteralPath (Join-Path $sourcePrefix "conda-meta") -Filter "fenics-jit-micro-clang-*.json" -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $recordPath) { throw "installed Stage-7 base package record is missing" }
          $record = Get-Content -LiteralPath $recordPath -Raw | ConvertFrom-Json
          if ([string]$record.version -ne "20260826" -or [string]$record.build -ne "h9490d1a_1") { throw "unexpected installed Stage-7 base package identity" }
          if ($record.sha256 -and [string]$record.sha256 -ne $env:BASE_PACKAGE_SHA256) { throw "installed Stage-7 base package SHA-256 differs from the pinned public file" }

          $backend = Join-Path $sourcePrefix "Library/fenics-jit/backends/micro-clang"
          if (-not (Test-Path -LiteralPath (Join-Path $backend "metadata.json") -PathType Leaf)) {
            throw "installed Stage-7 base backend is missing"
          }

          $staged = Join-Path $PWD "micro-clang-phase5-source"
          Remove-Item -Recurse -Force $staged -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $backend -Destination $staged -Recurse -Force

          # Keep the currently qualified backend wrapper while preserving the
          # Stage-7 compiler/sysroot bytes.
          Copy-Item -LiteralPath "recipes/fenics-jit-micro-clang/micro_clang_runtime.py" -Destination (Join-Path $staged "micro_clang_runtime.py") -Force
          # Python 3.15 needs the same Stable-ABI import library under the
          # minor-version name that setuptools requests for MinGW-style builds.
          # Generate only that alias from the already-qualified python3.def;
          # compiler/sysroot bytes remain the Stage-7 artifact.
          $pythonLibDir = Join-Path $staged "lib\python"
          $dlltool = Join-Path $staged "bin\llvm-dlltool.exe"
          $defPath = Join-Path $pythonLibDir "python3.def"
          $python315 = Join-Path $pythonLibDir "libpython315.a"
          foreach ($required in @($dlltool, $defPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "required Stable-ABI packaging input is missing: $required"
            }
          }
          if (-not (Test-Path -LiteralPath $python315 -PathType Leaf)) {
            & $dlltool -m i386:x86-64 -d $defPath -l $python315 -D python3.dll
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $python315 -PathType Leaf)) {
              throw "failed to generate Python 3.15 Stable-ABI import library"
            }
          }

          $metadataPath = Join-Path $staged "metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ([string]$metadata.python_import_library_abi -ne "python3.dll") {
            throw "unexpected Python import-library ABI in Stage-7 metadata"
          }
          $metadata.python_import_library_aliases = @("python3", "python312", "python313", "python314", "python315")
          [IO.File]::WriteAllText(
            $metadataPath,
            ($metadata | ConvertTo-Json -Depth 10) + [Environment]::NewLine,
            (New-Object Text.UTF8Encoding($false))
          )

          $manifestInputs = @(
            Get-ChildItem -LiteralPath $staged -Recurse -File |
              Where-Object { $_.Name -notin @("manifest.csv", "size.txt") } |
              Sort-Object FullName
          )
          $manifest = foreach ($file in $manifestInputs) {
            $relative = $file.FullName.Substring($staged.Length).TrimStart("\")
            [pscustomobject]@{
              path = $relative.Replace("\", "/")
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Csv -NoTypeInformation | Set-Content -LiteralPath (Join-Path $staged "manifest.csv") -Encoding utf8

          $sizePath = Join-Path $staged "size.txt"
          for ($iteration = 0; $iteration -lt 5; $iteration++) {
            $files = @(Get-ChildItem -LiteralPath $staged -Recurse -File | Sort-Object FullName)
            $bytes = [int64](($files | Measure-Object Length -Sum).Sum)
            $next = @(
              "payload_file_count=$($files.Count)"
              "payload_bytes=$bytes"
              "payload_mib=$([math]::Round($bytes / 1MB, 4))"
              "manifest_hashed_file_count=$($manifestInputs.Count)"
              "manifest_excludes=manifest.csv,size.txt"
              "stage_aw_reference_mib=215.19"
              "phase4_early_continuation_gate_mib=108.2"
              "phase4_size_gate_status=$(if (($bytes / 1MB) -le 108.2) { 'pass' } else { 'fail' })"
            ) -join [Environment]::NewLine
            $next += [Environment]::NewLine
            $previous = if (Test-Path -LiteralPath $sizePath) { Get-Content -LiteralPath $sizePath -Raw } else { "" }
            [IO.File]::WriteAllText($sizePath, $next, [Text.Encoding]::ASCII)
            if ($previous -eq $next) { break }
          }

          $files = @(Get-ChildItem -LiteralPath $staged -Recurse -File)
          $bytes = [int64](($files | Measure-Object Length -Sum).Sum)
          if (($bytes / 1MB) -ge 106.2016) {
            throw "Stage-7 staged payload no longer improves on the qualified Stage-6 ThinLTO parent: $($bytes / 1MB) MiB"
          }

          [pscustomobject]@{
            base_package = $env:BASE_PACKAGE_FILE
            base_package_sha256 = $env:BASE_PACKAGE_SHA256
            base_package_bytes = [int64]$env:BASE_PACKAGE_BYTES
            base_qualification_run = [int64]$env:BASE_QUALIFICATION_RUN_ID
            base_qualification_head = $env:BASE_QUALIFICATION_HEAD
            payload_bytes = $bytes
            payload_mib = $bytes / 1MB
            wrapper_sha256 = (Get-FileHash -LiteralPath (Join-Path $staged "micro_clang_runtime.py") -Algorithm SHA256).Hash.ToLowerInvariant()
            manifest_sha256 = (Get-FileHash -LiteralPath (Join-Path $staged "manifest.csv") -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 stage7-derived-source.json

      - name: Build Stage-7 micro-Clang package
        shell: pwsh
        run: |
          $rattler = Get-ChildItem "$env:MAMBA_ROOT_PREFIX/envs/micro-clang-stage7-package-tools" -Recurse -Filter rattler-build.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $rattler) { throw "rattler-build.exe not found" }

          Remove-Item -Recurse -Force stage7-output -ErrorAction SilentlyContinue
          & $rattler build --recipe recipes/fenics-jit-micro-clang/recipe.yaml --output-dir stage7-output --channel-priority strict -c precise-simulation -c conda-forge
          if ($LASTEXITCODE -ne 0) { throw "Stage-7 micro-Clang package build failed" }

          $package = Get-ChildItem stage7-output -Recurse -Filter "fenics-jit-micro-clang-*.conda" |
            Where-Object { $_.Name -match "_2\.conda$" } |
            Select-Object -First 1
          if (-not $package) { throw "Stage-7 build-number-2 package missing" }

          [pscustomobject]@{
            package = $package.Name
            bytes = $package.Length
            mib = $package.Length / 1MB
            sha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 stage7-package.json

      - name: Upload Stage-7 package channel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage7-package-channel
          path: |
            stage7-output/
            base-package.json
            stage7-derived-source.json
            stage7-package.json
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Stage 7 default micro-Clang compatibility (Python ${{ matrix.python }})
    needs: repackage
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Stage-7 package channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase4-stage7-package-channel
          path: stage7-channel

      - name: Install micromamba bootstrap
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-stage7-integration-bootstrap
          create-args: >-
            -c conda-forge
            python=3.12

      - name: Install default micro-Clang environment
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "s7 i py${{ matrix.python }}"
          $channelRoot = Resolve-Path "stage7-channel/stage7-output"
          $channel = "file:///" + ($channelRoot.Path -replace '\\','/')
          & $env:MAMBA_EXE create -y -p $prefix --override-channels --strict-channel-priority -c $channel -c precise-simulation -c conda-forge "python=${{ matrix.python }}" "libblas=*=*openblas" fenics-dolfinx "fenics-jit-micro-clang=20260826=*_2" pefile | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Stage-7 integration environment installation failed" }
          $condaMeta = Join-Path $prefix "conda-meta"
          $microRecords = @(Get-ChildItem -LiteralPath $condaMeta -Filter "fenics-jit-micro-clang-*.json" -File)
          if ($microRecords.Count -ne 1) { throw "default environment does not contain exactly one micro-Clang package" }
          $micro = Get-Content -LiteralPath $microRecords[0].FullName -Raw | ConvertFrom-Json
          if ([string]$micro.build -notmatch "_2$") { throw "default environment did not select micro-Clang build 2: $($micro.build)" }
          foreach ($forbidden in @("fenics-jit-llvm-mingw", "fenics-jit-tinycc")) {
            if (Get-ChildItem -LiteralPath $condaMeta -Filter "$forbidden-*.json" -File -ErrorAction SilentlyContinue) {
              throw "default environment unexpectedly contains $forbidden"
            }
          }
          $pythonTag = "${{ matrix.python }}" -replace '\.', ''
          $pythonImport = Join-Path $prefix "Library/fenics-jit/backends/micro-clang/lib/python/libpython${pythonTag}.a"
          if (-not (Test-Path -LiteralPath $pythonImport -PathType Leaf)) { throw "micro-Clang package is missing $pythonImport" }

      - name: Run implicit selector and fresh FFCx JIT
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "s7 i py${{ matrix.python }}"
          $diag = Join-Path $PWD "stage7-integration-py${{ matrix.python }}"
          $cache = Join-Path $env:RUNNER_TEMP "s7 cache py${{ matrix.python }}"
          Remove-Item -Recurse -Force $cache, $diag -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cache, $diag | Out-Null
          $env:PATH = "$prefix;$prefix\Scripts;$prefix\Library\bin;$env:PATH"
          Remove-Item Env:FENICS_JIT_COMPILER -ErrorAction SilentlyContinue
          $python = Join-Path $prefix "python.exe"
          $selector = Join-Path $prefix "Library/fenics-jit/runtime/fenics_jit_selector.py"
          $selectorText = (& $python $selector | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "implicit selector failed on Python ${{ matrix.python }}" }
          $selectorText | Set-Content -Encoding utf8 (Join-Path $diag "selector.json")
          $selectorRecord = $selectorText | ConvertFrom-Json
          if ([string]$selectorRecord.selected_backend -ne "micro-clang") {
            throw "implicit selector chose $($selectorRecord.selected_backend) on Python ${{ matrix.python }}"
          }

          $env:XDG_CACHE_HOME = $cache
          $env:FENICS_JIT_VERBOSE = "1"
          & $python scripts/test-poisson.py 2>&1 | Tee-Object -FilePath (Join-Path $diag "poisson.txt")
          if ($LASTEXITCODE -ne 0) { throw "fresh Poisson JIT failed on Python ${{ matrix.python }}" }
          $modules = @(Get-ChildItem -LiteralPath $cache -Recurse -Filter "*.pyd" -File -ErrorAction SilentlyContinue)
          if ($modules.Count -eq 0) { throw "fresh Poisson JIT produced no extension module on Python ${{ matrix.python }}" }
          & $python -c "import pefile,sys; p=pefile.PE(sys.argv[1]); imports={x.dll.decode().lower() for x in p.DIRECTORY_ENTRY_IMPORT}; print(sorted(imports)); assert 'python3.dll' in imports; assert not any(x.startswith('python3') and x != 'python3.dll' for x in imports)" $modules[0].FullName | Tee-Object -FilePath (Join-Path $diag "pe-imports.txt")
          if ($LASTEXITCODE -ne 0) { throw "JIT module does not use the Stable ABI on Python ${{ matrix.python }}" }

      - name: Upload Stage-7 integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage7-integration-py${{ matrix.python }}
          path: stage7-integration-py${{ matrix.python }}/
          if-no-files-found: warn
          retention-days: 30

  standalone:
    name: Stage 7 micro-Clang-only Nuitka qualification
    needs: integration
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Stage-7 package channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase4-stage7-package-channel
          path: stage7-channel

      - name: Install micromamba bootstrap
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-stage7-standalone-bootstrap
          create-args: >-
            -c conda-forge
            python=3.12

      - name: Create standalone build prefix
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "s7 build with spaces"
          $channelRoot = Resolve-Path "stage7-channel/stage7-output"
          $channel = "file:///" + ($channelRoot.Path -replace '\\','/')

          & $env:MAMBA_EXE create -y -p $prefix --override-channels --strict-channel-priority -c $channel -c precise-simulation -c conda-forge python=3.12 "libblas=*=*openblas" fenics-dolfinx "fenics-jit-runtime=0.1.0" "fenics-jit-micro-clang=20260826=*_2" "cffi=2.1.*" "setuptools=84.*" pefile "nuitka=4.1.3" ordered-set zstandard c-compiler | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Stage-7 standalone build environment install failed" }
          if (Test-Path -LiteralPath (Join-Path $prefix "Library/fenics-jit/backends/tinycc")) {
            throw "TinyCC unexpectedly installed in Stage-7 build prefix"
          }

      - name: Build micro-Clang-only standalone bundle
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "s7 build with spaces"
          ./scripts/fenicsx-nuitka.ps1 -EntryPoint "scripts/micro-clang-jit/phase6-standalone.py" -OutputDir "stage7 output with spaces" -ExistingPrefix $prefix -JitBackend micro-clang

      - name: Run hermetic serial and MPI standalone proof
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "s7 build with spaces"
          $output = Join-Path $PWD "stage7 output with spaces"
          $dist = Get-ChildItem -LiteralPath $output -Directory -Filter "*.dist" |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "fenicsx.exe") } |
            Select-Object -First 1
          if (-not $dist) { throw "Stage-7 Nuitka distribution not found" }

          $jit = Join-Path $dist.FullName "fenics-jit"
          $micro = Join-Path $jit "backends/micro-clang"
          foreach ($forbiddenBackend in @("llvm-mingw", "tinycc")) {
            if (Test-Path -LiteralPath (Join-Path $jit "backends/$forbiddenBackend")) {
              throw "$forbiddenBackend was staged into the Stage-7 micro-Clang-only bundle"
            }
          }

          New-Item -ItemType Directory -Force stage7-downstream-evidence | Out-Null
          $hidden = "$prefix-hidden"
          if (Test-Path -LiteralPath $hidden) { Remove-Item -Recurse -Force $hidden }
          Move-Item -LiteralPath $prefix -Destination $hidden
          try {
            $env:FENICS_PHASE6_BUNDLE_ROOT = $dist.FullName
            $env:FENICS_PHASE6_ORIGINAL_PREFIX = $prefix
            $env:FENICS_JIT_ROOT = $jit
            $env:FENICS_JIT_COMPILER = "micro-clang"
            $env:FENICS_JIT_FFCX_INCLUDE = Join-Path $dist.FullName "ffcx/codegeneration"
            $env:FENICS_JIT_VERBOSE = "1"

            foreach ($name in @(
              "CC","CXX","CPP","LD","LDSHARED","INCLUDE","LIB","LIBPATH","LIBRARY_PATH",
              "CPATH","C_INCLUDE_PATH","CPLUS_INCLUDE_PATH","COMPILER_PATH","GCC_EXEC_PREFIX",
              "VSINSTALLDIR","VCINSTALLDIR","VCToolsInstallDir","WindowsSdkDir",
              "WindowsSDKVersion","UniversalCRTSdkDir","UCRTVersion","DISTUTILS_USE_SDK","MSSdk"
            )) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            Get-ChildItem Env: |
              Where-Object { $_.Name -like "VSCMD_*" } |
              ForEach-Object { Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue }

            $env:PATH = "$($dist.FullName);$env:SystemRoot\System32;$env:SystemRoot"
            $exe = Join-Path $dist.FullName "fenicsx.exe"
            & $exe --work-dir (Join-Path $PWD "stage7 standalone work with spaces") --output (Join-Path $PWD "stage7-downstream-evidence/stage7-standalone-summary.json")
            if ($LASTEXITCODE -ne 0) { throw "Stage-7 standalone executable failed" }

            $mpiexec = Join-Path $dist.FullName "mpiexec.exe"
            & $mpiexec -localonly -n 2 -env PATH $env:PATH -env FENICS_PHASE6_BUNDLE_ROOT $dist.FullName -env FENICS_PHASE6_ORIGINAL_PREFIX $prefix -env FENICS_JIT_ROOT $jit -env FENICS_JIT_COMPILER micro-clang -env FENICS_JIT_FFCX_INCLUDE $env:FENICS_JIT_FFCX_INCLUDE $exe --mpi-child --work-dir (Join-Path $PWD "stage7 standalone mpi work with spaces") --output (Join-Path $PWD "stage7-downstream-evidence/stage7-standalone-mpi-summary.json")
            if ($LASTEXITCODE -ne 0) { throw "Stage-7 standalone MPI proof failed" }
          } finally {
            Move-Item -LiteralPath $hidden -Destination $prefix
          }

      - name: Upload Stage-7 downstream evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage7-downstream
          path: |
            stage7-downstream-evidence/
            stage7 output with spaces/nuitka-report.xml
            stage7 standalone work with spaces/diagnostics/
            stage7 standalone mpi work with spaces/diagnostics/
          if-no-files-found: warn
          retention-days: 30
