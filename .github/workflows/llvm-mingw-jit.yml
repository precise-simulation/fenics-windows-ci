name: llvm-mingw-jit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/llvm-mingw-jit.yml"
      - "recipes/fenics-jit-llvm-mingw/**"
      - "scripts/llvm-mingw-jit/**"
      - "specs/llvm-mingw-ffcx-jit/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/llvm-mingw-jit.yml"
      - "recipes/fenics-jit-llvm-mingw/**"
      - "scripts/llvm-mingw-jit/**"
      - "specs/llvm-mingw-ffcx-jit/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('llvm-mingw-jit-pr-{0}', github.event.pull_request.number) || 'llvm-mingw-jit-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-package:
    name: Build runtime package
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install package build tooling
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: jit-package-build
          create-args: >-
            -c conda-forge
            python=3.12
            rattler-build=0.74.0

      - name: Build conservative LLVM-MinGW runtime package
        shell: pwsh
        run: ./scripts/llvm-mingw-jit/build-runtime-package.ps1

      - name: Install package into compiler-free clean prefix
        shell: pwsh
        run: |
          $localPath = (Resolve-Path "jit-package-output").Path -replace "\\", "/"
          $localChannel = "file:///$localPath"
          & $env:MAMBA_EXE create -y `
            -r $env:MAMBA_ROOT_PREFIX `
            -n jit-package-only `
            --override-channels --strict-channel-priority `
            -c $localChannel `
            fenics-jit-llvm-mingw
          if ($LASTEXITCODE -ne 0) { throw "clean package install failed" }

          $records = & $env:MAMBA_EXE list -r $env:MAMBA_ROOT_PREFIX -n jit-package-only --json | ConvertFrom-Json
          $records | ConvertTo-Json -Depth 6 | Set-Content "jit-package-logs/clean-prefix-packages.json"
          $unexpected = @($records | Where-Object { $_.name -ne "fenics-jit-llvm-mingw" })
          if ($unexpected.Count -gt 0) {
            throw "runtime package unexpectedly pulled dependencies: $($unexpected.name -join ', ')"
          }

          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/jit-package-only"
          $clang = Join-Path $prefix "Library/fenics-jit/bin/x86_64-w64-mingw32-clang.exe"
          $smokeC = Join-Path $env:RUNNER_TEMP "fenics-jit-package-smoke.c"
          $smokeDll = Join-Path $env:RUNNER_TEMP "fenics-jit-package-smoke.dll"
          "__declspec(dllexport) int fenics_jit_package_smoke(void) { return 42; }" | Set-Content $smokeC -Encoding ascii
          & $clang -shared $smokeC -o $smokeDll
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeDll)) {
            throw "compiler-free clean-prefix smoke compile failed"
          }

      - name: Upload runtime package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llvm-mingw-runtime-package
          path: |
            jit-package-output/win-64/
            jit-package-output/noarch/
            jit-package-logs/
          if-no-files-found: warn
          retention-days: 14

  package-jit:
    name: Packaged JIT (Python ${{ matrix.python }})
    needs: runtime-package
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download runtime package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: llvm-mingw-runtime-package
          path: .

      - name: Install isolated FEniCS runtime
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: llvm-mingw-jit
          create-args: >-
            --override-channels --strict-channel-priority
            -c precise-simulation -c conda-forge
            python=${{ matrix.python }}
            libblas=*=*openblas
            fenics-dolfinx
            cffi
            setuptools

      - name: Install packaged LLVM-MinGW JIT runtime
        shell: pwsh
        run: |
          $localPath = (Resolve-Path "jit-package-output").Path -replace "\\", "/"
          $localChannel = "file:///$localPath"
          & $env:MAMBA_EXE install -y `
            -r $env:MAMBA_ROOT_PREFIX `
            -n llvm-mingw-jit `
            --override-channels --strict-channel-priority `
            -c $localChannel -c precise-simulation -c conda-forge `
            fenics-jit-llvm-mingw
          if ($LASTEXITCODE -ne 0) { throw "runtime package install failed" }

      - name: Run packaged CFFI and FFCx Poisson proofs
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/llvm-mingw-jit"
          $toolchain = Join-Path $prefix "Library/fenics-jit"
          ./scripts/llvm-mingw-jit/run-cffi-proof.ps1 `
            -PythonPrefix $prefix `
            -ToolchainRoot $toolchain `
            -WorkDir "jit-work" `
            -DiagnosticsDir "jit-diagnostics/proof" `
            -PoissonScript "scripts/test-poisson.py"

          $importSource = Get-Content "jit-diagnostics/proof/python-import-library-source.txt" -Raw
          if ($importSource -notmatch "source=packaged") {
            throw "JIT proof did not use package-built Python import libraries"
          }

      - name: Upload JIT diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llvm-mingw-package-jit-py${{ matrix.python }}
          path: |
            jit-diagnostics/
            jit-work/setup.cfg
            jit-work/*.c
            jit-work/*.pyd
            jit-work/ffcx-cache/**/*.c
            jit-work/ffcx-cache/**/*.pyd
            jit-work/ffcx-cache/**/setup.cfg
          if-no-files-found: warn
          retention-days: 14
