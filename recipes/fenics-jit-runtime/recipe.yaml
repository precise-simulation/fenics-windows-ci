schema_version: 1

context:
  name: fenics-jit-runtime
  version: "0.1.0"
  build: 1

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: ${{ build }}
  script:
    file: build.bat

requirements:
  run: []

tests:
  - script:
      - python -m py_compile %LIBRARY_PREFIX%\fenics-jit\runtime\fenics_jit_runtime.py
    requirements:
      run:
        - python 3.12.*

about:
  summary: Shared Windows FEniCS FFCx/CFFI JIT runtime bootstrap
  description: |
    Owns the backend-neutral Library/fenics-jit/runtime path used by DOLFINx.
    Compiler implementations are supplied separately by backend packages.
  license: BSD-3-Clause
  license_file: ../../LICENSE.txt

extra:
  recipe-maintainers:
    - precsim
