name: chatgpt-ci-signal

on:
  workflow_run:
    workflows: ["stack"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post completed stack marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr_number="${PR_NUMBER}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq 'map(select(.state == "open")) | .[0].number // empty')"
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "No open pull request found for ${HEAD_SHA}; nothing to notify."
            exit 0
          fi

          body="chatgpt-ci: stack #${RUN_NUMBER} ${CONCLUSION} run=${RUN_ID} attempt=${RUN_ATTEMPT} sha=${HEAD_SHA}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/issues/${pr_number}/comments" \
            -f body="${body}"
