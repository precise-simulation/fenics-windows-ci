context:
  name: fenics-dolfinx
  version: "0.11.0"
  build: 10
  major_minor: ${{ (version | split('.'))[:2] | join('.') }}.*
  ufl_version: "2026.1.*"
  # Python Stable ABI (SABI with nanobind requires 3.12)
  abi3_tag: cp312
  abi3_python: "3.12"
  build_abi3: ${{ is_abi3 and match(python, abi3_python + ".*") }}
  skip_abi3: ${{ is_abi3 and match(python, ">=3.13") }}

  # nanobind abi:
  abi_version: 2.${{ nanobind_abi }}

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - if: win
    then:
      - url: https://github.com/fenics/dolfinx/archive/refs/tags/v${{ version }}.tar.gz
        sha256: 4df167823d316da519c1b2f8d5d0afc20de1405de601dab51da67a405b25cc2f
        file_name: dolfinx-${{ version }}.tar.gz
        # The MSVC nanobind caster fix is applied by build-dolfinx.bat after
        # prepare-dolfinx-source.bat extracts the archive (rattler-build does
        # not extract sources on Windows, so `patches:` never reaches the
        # compiled tree). See caster-petsc-msvc-nanobind.patch.
  - if: not win
    then:
      - url: https://github.com/fenics/dolfinx/archive/refs/tags/v${{ version }}.tar.gz
        sha256: 4df167823d316da519c1b2f8d5d0afc20de1405de601dab51da67a405b25cc2f
        patches:
          - remove-symlink.patch

build:
  number: ${{ (build | int + 100) if scalar == 'real' else build }}
  skip: ppc64le or skip_abi3 or match(python, "<3.11") or (win and not match(python, "3.12.*"))

outputs:
  - package:
      name: fenics-libdolfinx
    build:
      script: build-libdolfinx
      variant:
        use_keys:
          - python
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
        - cmake
        - ninja
        - pkg-config
        - if: "mpi == 'openmpi' and build_platform != target_platform"
          then: ${{ mpi }}
      host:
        - ${{ mpi | replace("impi", "impi-devel") }}
        - if: win
          then:
            - libopenblas * pthreads_*
            - petsc * ${{ scalar }}_*
        - if: not win
          then:
            - libadios2
            - libadios2 * mpi_${{ mpi }}_*
            - kahip
            - parmetis
            - petsc
            - petsc * ${{ scalar }}_*
            - slepc
            - superlu_dist
        - libboost-devel
        - hdf5 ${{ hdf5 }}.* mpi_${{ mpi }}_*
        - libscotch
        - libptscotch
        - pugixml
        - fmt
        - spdlog
        - fenics-libbasix ${{ major_minor }}
        - fenics-ufcx ${{ major_minor }}
        - if: win
          # these shouldn't be required,
          # but are in INTERFACE_LINK_LIBRARIES for libscotch
          then:
            - zlib
            - liblzma-devel
      run:
        # these don't have run_exports
        # but are needed at runtime for code generation
        - fenics-ufcx ${{ major_minor }}
        - hdf5 ${{ hdf5 }}.* mpi_${{ mpi }}_*
        - if: not win
          then:
            - ${{ pin_compatible("parmetis", upper_bound="x.x") }}
        - if: not win
          then:
            # needs boost metadata just to CMake-load fenix-libdolfinx
            # (Windows: boost is private since apply-boost-private-fix.py)
            - libboost-devel
      # Scotch is statically linked into dolfinx.dll; win-64 scotch packages
      # carry no DLLs, so their headers/CMake files are build-only there.
      # Boost is likewise private on Windows (apply-boost-private-fix.py).
      ignore_run_exports:
        from_package:
          - if: win
            then:
              - libscotch
              - libptscotch
              - libboost-devel
      run_exports:
        weak:
          - ${{ pin_subpackage("fenics-libdolfinx", upper_bound="x.x.x") }}
          - if: win
            then:
              - petsc * ${{ scalar }}_*
          - if: not win
            then:
              - petsc * ${{ scalar }}_*
          - ${{ mpi | replace("impi", "impi_rt") }}
    tests:
      - script:
          # rattler-build bug:
          # invoking .sh by default instead of .bat
          file: test-libdolfinx${{ ".bat" if win else "" }}
          env:
            target_platform: ${{ target_platform }}
        files:
          recipe:
            - if: win
              then: impi-toolchain.cmake
            - if: win
              then: tests/CMakeLists.txt
            - if: win
              then: tests/main.cpp
          source:
            - cpp/test/
        requirements:
          run:
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}
            - if: linux and target_platform != build_platform
              then:
                # __glibc virtual package seems to resolve wrong on emulated linux
                - ${{ stdlib("c") }}
            - if: win
              then: impi-devel
            - if: win
              then: libopenblas * pthreads_*
            - if: win
              then: petsc * ${{ scalar }}_*
            - if: win
              # unittests compile the installed public headers, which include
              # boost headers directly; no longer exported since the private-
              # boost change (apply-boost-private-fix.ps1)
              then: libboost-devel
            - if: win
              # guard: newest gmsh builds pin metis <5.1.1 which conflicts
              # with petsc's metis 5.2; without this the solver backtracks
              # to an old petsc whose MUMPS+METIS ordering hangs forever
              then: metis >=5.2,<5.2.2.0a0
            - pkg-config
            - cmake
            - catch2 3.*
            - ninja
            - fenics-ffcx ${{ major_minor }}

  - package:
      name: fenics-dolfinx
    build:
      script:
        file: build-dolfinx
        env:
          SKBUILD_WHEEL_PY_API: ${{ "cp312" if build_abi3 else "" }}
      python:
        version_independent: ${{ build_abi3 }}
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
        - ${{ compiler("cxx") }}
        - cmake
        - ninja
        - pkg-config
        - fenics-basix-nanobind-abi ${{ abi_version }}.*
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - nanobind
            - nanobind-abi
            - if: mpi == 'openmpi'
              then: ${{ mpi }}
      host:
        - ${{ mpi | replace("impi", "impi-devel") }}
        # hdf5 shouldn't be needed here, but solver fails without it
        - hdf5 ${{ hdf5 }}.* mpi_${{ mpi }}_*
        - ${{ pin_subpackage("fenics-libdolfinx", exact=True) }}
        - fenics-libdolfinx ${{ major_minor }}
        - python
        - if: build_abi3
          then:
            - python-abi3
        - pip
        - scikit-build-core
        - wheel
        - nanobind
        - nanobind-abi
        - fenics-basix ${{ major_minor }}
        - fenics-basix-nanobind-abi ${{ abi_version }}.*
        - mpi4py
        - if: win
          then:
            - libopenblas * pthreads_*
            - petsc * ${{ scalar }}_*
            - petsc4py
        - if: not win
          then:
            - petsc * ${{ scalar }}_*
            - petsc4py
            - slepc
            - slepc4py
        # Boost headers: the Python wrapper sources include boost headers
        # directly, and keeping the package here also avoids a historical
        # solver error on libxml2's noicu build. Its run export is ignored
        # on Windows below so no libboost reaches runtime metadata.
        - libboost-devel
      run:
        # code generation only needs c, not cxx
        # get implementation, not full activation package
        # need unqualified 'gcc' to get `gcc` executable
        - if: win
          then:
            # windows only has activation
            - ${{ compiler("c") }}
          else:
            - ${{ c_compiler | default("bot") }} >=${{ c_compiler_version | default("0") }}
        - pkg-config
        - ${{ pin_subpackage("fenics-libdolfinx", exact=True) }}
        - cffi
        - mpi4py
        - numpy >=2
        - if: win
          then:
            - petsc * ${{ scalar }}_*
            - petsc4py
        - if: not win
          then:
            - petsc4py
            - slepc4py
        - fenics-basix ${{ major_minor }}
        - fenics-ffcx ${{ major_minor }}
        - fenics-ufl ${{ ufl_version }}
      ignore_run_exports:
        from_package:
          - if: win
            then:
              - libboost-devel
    tests:
      - script:
          # rattler-build bug:
          # invoking .sh by default instead of .bat
          file: test-dolfinx${{ ".bat" if win else "" }}
          env:
            scalar: ${{ scalar }}
            target_platform: ${{ target_platform }}
        files:
          recipe:
            - test_dolfinx.py
            - tests/test_windows_petsc.py
          source:
            # pyproject 0.10 is incompatible with current pytest
            # - python/pyproject.toml
            - python/demo/
            - python/test/
        requirements:
          run:
            # abi3: exercise the package on a newer interpreter than it was built against
            - python ${{ "3.14.*" if (win or build_abi3) else "" }}
            - pip
            - pytest >=6
            - if: win
              then:
                # workaround pip check on Windows
                - colorama
            - python-gmsh
            - if: win
              then: metis >=5.2,<5.2.2.0a0
            - if: linux and aarch64
              then:
                - libgl-devel
            - if: linux and target_platform != build_platform
              then:
                # __glibc virtual package seems to resolve wrong on emulated linux
                - ${{ stdlib("c") }}
            - sympy
            - scipy
            - matplotlib-base
      - if: build_abi3
        then:
          - if: unix
            then:
              - script:
                  - abi3audit $PREFIX/lib/python3.13/site-packages/dolfinx/*.so --assume-minimum-abi3 3.12
                  - python3 -c 'import dolfinx'
                requirements:
                  run:
                    - abi3audit
                    - python 3.13.*

about:
  summary: The computational environment of FEniCSx
  description: |
    DOLFINx is the computational environment of FEniCSx
    and implements the FEniCS Problem Solving Environment in Python and C++.
  license: LGPL-3.0-or-later
  license_file: COPYING.LESSER
  homepage: https://fenicsproject.org
  repository: https://github.com/fenics/dolfinx
  documentation: https://docs.fenicsproject.org/dolfinx/v${{ version }}/

extra:
  feedstock-name: fenics-dolfinx
  recipe-maintainers:
    - minrk