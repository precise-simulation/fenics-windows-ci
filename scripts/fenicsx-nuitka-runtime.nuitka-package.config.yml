# Nuitka 4.1.3 knows that setuptools exposes its _vendor directory as a
# global import path, but the distutils alias can be analyzed before that path
# is active when setuptools is included as a root package. Apply the same
# compile-time import path directly to both distutils package identities and
# explicitly retain the small runtime vendor closure used by CFFI/distutils.
---
- module-name: 'distutils'
  import-hacks:
    - global-sys-path:
        - '../_vendor'
      when: 'standalone and win32'
  implicit-imports:
    - depends:
        - 'jaraco.functools'
        - 'jaraco.text'
        - 'jaraco.context'
        - 'more_itertools'
      when: 'standalone and win32'

- module-name: 'setuptools._distutils'
  import-hacks:
    - global-sys-path:
        - '../_vendor'
      when: 'standalone and win32'
  implicit-imports:
    - depends:
        - 'jaraco.functools'
        - 'jaraco.text'
        - 'jaraco.context'
        - 'more_itertools'
      when: 'standalone and win32'

# petsc4py's public PETSc.py module is a bootstrap shim that asks
# petsc4py.lib to load the native extension from petsc4py/lib/PETSc.pyd.
# When Nuitka freezes that shim as petsc4py.PETSc, the dynamic loader resolves
# back to the frozen shim and recurses. The build excludes that shim separately;
# prime the normal package attribute with the package-owned native extension.
- module-name: 'petsc4py'
  implicit-imports:
    - post-import-code:
        - |
          from petsc4py.lib import ImportPETSc as _fenics_import_petsc
          PETSc = _fenics_import_petsc()
          PETSc._initialize()
          del _fenics_import_petsc
      when: 'standalone and win32'
