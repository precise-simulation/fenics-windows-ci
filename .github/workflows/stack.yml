name: stack

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every stage even if versions are unchanged"
        type: boolean
        default: false
      upload:
        description: "Publish resulting packages to anaconda.org"
        type: boolean
        default: true

concurrency:
  group: stack-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      FORCE_ALL: ${{ inputs.force_all }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling (rattler-build, anaconda-client)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ci
          create-args: >-
            -c conda-forge
            rattler-build 0.74.*
            anaconda-client
          init-shell: powershell
          cache-environment: true
          cache-environment-key: ci-${{ hashFiles('.github/workflows/stack.yml') }}

      - name: Decide what to rebuild
        shell: pwsh
        run: |
          python scripts/check_versions.py
          Get-Content plan.json

      - name: Build changed stages
        shell: pwsh
        run: scripts/build-stack.ps1 -PlanFile plan.json

      - name: Upload to precise-simulation
        if: ${{ inputs.upload != false }}
        shell: pwsh
        run: |
          Get-ChildItem output/win-64 -Filter *.conda | ForEach-Object {
            Write-Host "== uploading $($_.Name) =="
            anaconda upload --user precise-simulation $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($_.Name)" }
          }
