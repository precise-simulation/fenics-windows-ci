schema_version: 1

context:
  name: fenics-jit-tinycc
  version: "0.9.28rc0"
  build: 0
  tinycc_revision: 0fb54300b56512754221d80adda85ddb9815bceb

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: ${{ build }}
  script:
    file: build.bat

requirements:
  build:
    - python 3.12.*
    - cffi 2.1.*
    - setuptools 84.*
    - vs2022_win-64 19.44.*
    - vswhere 3.1.7
  run:
    - python >=3.12,<3.15
    - cffi 2.1.*
    - setuptools 84.*

tests:
  - script:
      file: test-package.bat
    requirements:
      run:
        - python 3.12.*
        - cffi 2.1.*
        - setuptools 84.*
        - pefile

about:
  summary: Compact TinyCC backend for FEniCS FFCx/CFFI JIT on Windows
  description: |
    Experimental x86-64 Windows TinyCC backend qualified for FEniCS FFCx/CFFI
    runtime JIT. The package owns only Library/fenics-jit/backends/tinycc and
    does not own the shared FEniCS JIT runtime selector/bootstrap path.
  license: LGPL-2.1-only
  homepage: https://bellard.org/tcc/
  repository: https://github.com/TinyCC/tinycc

extra:
  recipe-maintainers:
    - precsim
