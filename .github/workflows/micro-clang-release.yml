name: micro-clang-release

on:
  pull_request:
    paths:
      - ".github/workflows/micro-clang-release.yml"
      - "specs/micro-clang-ffcx-jit/07-package-promotion.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/micro-clang-release.yml"
      - "specs/micro-clang-ffcx-jit/07-package-promotion.md"
  workflow_dispatch:
    inputs:
      upload:
        description: "Publish the verified package to anaconda.org"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: micro-clang-release-${{ github.ref }}
  cancel-in-progress: false

env:
  QUALIFIED_RUN_ID: "38111201186"
  QUALIFIED_HEAD: "f4fcd90b3cdc960c7f6e5d2eb2ee6a1407490423"
  QUALIFIED_ARTIFACT: "micro-clang-phase4-stage7-package-channel"
  PACKAGE_FILE: "fenics-jit-micro-clang-20260826-h9490d1a_2.conda"
  PACKAGE_SHA256: "3cb9a8b2a1c16c3cba1bd89dc587637028a4fec8c5343380e4c7f4a67fa5de4d"
  PACKAGE_BYTES: "31892148"

jobs:
  promote:
    name: Verify and promote qualified Full-LTO package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pinned qualification run succeeded
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$env:QUALIFIED_RUN_ID"
          if ([string]$run.status -ne "completed" -or [string]$run.conclusion -ne "success") {
            throw "qualified run $env:QUALIFIED_RUN_ID is not a completed success"
          }
          if ([string]$run.head_sha -ne $env:QUALIFIED_HEAD) {
            throw "qualified run head mismatch: $($run.head_sha)"
          }

      - name: Download exact qualified Stage-7 package channel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.QUALIFIED_ARTIFACT }}
          path: qualified-stage7
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.QUALIFIED_RUN_ID }}

      - name: Verify qualification provenance and exact package bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $PWD "qualified-stage7/stage7-output/win-64/$env:PACKAGE_FILE"
          $packageJsonPath = Join-Path $PWD "qualified-stage7/stage7-package.json"
          $sourceJsonPath = Join-Path $PWD "qualified-stage7/stage7-derived-source.json"
          $baseJsonPath = Join-Path $PWD "qualified-stage7/base-package.json"
          if (-not (Test-Path -LiteralPath $package)) { throw "qualified package is missing" }
          if (-not (Test-Path -LiteralPath $packageJsonPath)) { throw "stage7-package.json is missing" }
          if (-not (Test-Path -LiteralPath $sourceJsonPath)) { throw "stage7-derived-source.json is missing" }
          if (-not (Test-Path -LiteralPath $baseJsonPath)) { throw "base-package.json is missing" }

          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $package).Length
          if ($hash -ne $env:PACKAGE_SHA256) { throw "qualified package SHA-256 mismatch: $hash" }
          if ($bytes -ne [int64]$env:PACKAGE_BYTES) { throw "qualified package size mismatch: $bytes" }

          $packageJson = Get-Content -LiteralPath $packageJsonPath -Raw | ConvertFrom-Json
          if ([string]$packageJson.package -ne $env:PACKAGE_FILE) { throw "qualified package filename mismatch" }
          if ([string]$packageJson.sha256 -ne $env:PACKAGE_SHA256) { throw "qualified package record hash mismatch" }
          if ([int64]$packageJson.bytes -ne [int64]$env:PACKAGE_BYTES) { throw "qualified package record size mismatch" }

          $baseJson = Get-Content -LiteralPath $baseJsonPath -Raw | ConvertFrom-Json
          if ([string]$baseJson.package -ne "fenics-jit-micro-clang-20260826-h9490d1a_1.conda") { throw "unexpected base package filename" }
          if ([string]$baseJson.sha256 -ne "d8a3510eb08615cb890dbf8f6da8b0d26f573e16a7b0bbee657edf563d40ad01") { throw "unexpected base package SHA-256" }
          if ([int64]$baseJson.bytes -ne 31890069) { throw "unexpected base package size" }
          if ([int64]$baseJson.qualification_run -ne 37100978194) { throw "unexpected base qualification run" }
          if ([string]$baseJson.qualification_head -ne "dbcc097f2a1084d89b92b280c96d98dc5a7f8a9d") { throw "unexpected base qualification head" }

          $sourceJson = Get-Content -LiteralPath $sourceJsonPath -Raw | ConvertFrom-Json
          if ([string]$sourceJson.base_package -ne [string]$baseJson.package) { throw "derived source base package filename mismatch" }
          if ([string]$sourceJson.base_package_sha256 -ne [string]$baseJson.sha256) { throw "derived source base package hash mismatch" }
          if ([int64]$sourceJson.base_package_bytes -ne [int64]$baseJson.bytes) { throw "derived source base package size mismatch" }
          if ([int64]$sourceJson.base_qualification_run -ne [int64]$baseJson.qualification_run) { throw "derived source base qualification run mismatch" }
          if ([string]$sourceJson.base_qualification_head -ne [string]$baseJson.qualification_head) { throw "derived source base qualification head mismatch" }
          if ([int64]$sourceJson.payload_bytes -ne 109094136) { throw "Stage-7 source payload mismatch" }
          if ([string]$sourceJson.manifest_sha256 -ne "205cb2af5fef7bf9b2456322a4dc188db247edad828fa6b399d3e225f7e3c3b5") { throw "Stage-7 source manifest mismatch" }
          if ([string]$sourceJson.wrapper_sha256 -ne "7f5c6a59a8e4b4e286f105bd94b27308fa162debf0814cecc9534a7ebb2c6d66") { throw "Stage-7 source wrapper mismatch" }

          [ordered]@{
            qualification_run = [int64]$env:QUALIFIED_RUN_ID
            qualification_head = $env:QUALIFIED_HEAD
            artifact = $env:QUALIFIED_ARTIFACT
            package = $env:PACKAGE_FILE
            package_bytes = $bytes
            package_sha256 = $hash
            base_package = [ordered]@{
              package = [string]$baseJson.package
              bytes = [int64]$baseJson.bytes
              sha256 = [string]$baseJson.sha256
              qualification_run = [int64]$baseJson.qualification_run
              qualification_head = [string]$baseJson.qualification_head
            }
            source_payload_bytes = [int64]$sourceJson.payload_bytes
            source_manifest_sha256 = [string]$sourceJson.manifest_sha256
            source_wrapper_sha256 = [string]$sourceJson.wrapper_sha256
            verified = $true
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 promotion-record.json

      - name: Install release verification tooling
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-release
          create-args: >-
            -c conda-forge
            python=3.12
            anaconda-client=1.14.1

      - name: Put release environment on PATH
        shell: pwsh
        run: |
          "$env:MAMBA_ROOT_PREFIX/envs/micro-clang-release" >> $env:GITHUB_PATH
          "$env:MAMBA_ROOT_PREFIX/envs/micro-clang-release/Library/bin" >> $env:GITHUB_PATH
          "$env:MAMBA_ROOT_PREFIX/envs/micro-clang-release/Scripts" >> $env:GITHUB_PATH

      - name: Clean-install exact package and verify backend ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $channelPath = (Resolve-Path "qualified-stage7/stage7-output").Path -replace "\\", "/"
          $localChannel = "file:///$channelPath"
          foreach ($pythonVersion in @("3.12", "3.15")) {
            $pythonTag = $pythonVersion -replace '\.', ''
            $prefix = Join-Path $env:RUNNER_TEMP "micro clang release py$pythonTag"
            $args = @(
              "create", "-y", "-p", $prefix, "--override-channels", "--strict-channel-priority",
              "-c", $localChannel, "-c", "precise-simulation", "-c", "conda-forge",
              "python=$pythonVersion", "fenics-ffcx", "fenics-jit-micro-clang=20260826=h9490d1a_2"
            )
            & $env:MAMBA_EXE @args | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "qualified package clean install failed for Python $pythonVersion" }

            $jit = Join-Path $prefix "Library/fenics-jit"
            $backend = Join-Path $jit "backends/micro-clang"
            $selector = Join-Path $jit "runtime/fenics_jit_selector.py"
            foreach ($forbidden in @("llvm-mingw", "tinycc")) {
              if (Test-Path -LiteralPath (Join-Path $jit "backends/$forbidden")) { throw "unexpected backend installed on Python ${pythonVersion}: $forbidden" }
            }
            $importLibrary = Join-Path $backend "lib/python/libpython${pythonTag}.a"
            if (-not (Test-Path -LiteralPath $importLibrary -PathType Leaf)) { throw "promoted package is missing $importLibrary" }

            $env:PATH = "$prefix;$prefix\Scripts;$prefix\Library\bin;$env:PATH"
            Remove-Item Env:FENICS_JIT_COMPILER -ErrorAction SilentlyContinue
            $selectorText = (& (Join-Path $prefix "python.exe") $selector | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "shared selector could not activate promoted micro-Clang package on Python $pythonVersion" }
            $selectorText | Set-Content -Encoding utf8 "selector-diagnostic-py${pythonTag}.json"
            $selectorRecord = $selectorText | ConvertFrom-Json
            if ([string]$selectorRecord.selected_backend -ne "micro-clang") { throw "promoted selector chose $($selectorRecord.selected_backend) on Python $pythonVersion" }

            $clang = Join-Path $backend "bin/x86_64-w64-mingw32-clang.exe"
            $smokeC = Join-Path $env:RUNNER_TEMP "micro-clang-release-smoke-py${pythonTag}.c"
            $smokeDll = Join-Path $env:RUNNER_TEMP "micro-clang-release-smoke-py${pythonTag}.dll"
            "__declspec(dllexport) int micro_clang_release_smoke(void) { return 42; }" | Set-Content -LiteralPath $smokeC -Encoding ascii
            & $clang -shared $smokeC -o $smokeDll
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $smokeDll)) { throw "promoted compiler smoke failed on Python $pythonVersion" }
          }

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-release-promotion-evidence
          path: |
            promotion-record.json
            selector-diagnostic-py*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact qualified package to precise-simulation
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
        shell: pwsh
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          $package = Join-Path $PWD "qualified-stage7/stage7-output/win-64/$env:PACKAGE_FILE"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:PACKAGE_SHA256) { throw "refusing publication because package hash changed" }
          anaconda upload --force --user precise-simulation $package
          if ($LASTEXITCODE -ne 0) { throw "micro-Clang package publication failed" }
