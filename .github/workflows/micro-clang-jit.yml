name: micro-clang-jit

# Experimental source-build qualification. This workflow is deliberately
# path-scoped so it does not add a second automatic run to unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/micro-clang-jit.yml"
      - "scripts/micro-clang-jit/**"
      - "specs/micro-clang-ffcx-jit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-clang-jit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0-reference:
    name: Phase 0 Stage-AW reference
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install reference-analysis tooling
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase0
          create-args: >-
            -c conda-forge
            python=3.12
            zstandard

      - name: Capture immutable Stage-AW identity, defaults, ABI and payload decomposition
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/micro-clang-phase0"
          ./scripts/micro-clang-jit/run-phase0.ps1 -PythonPrefix $prefix

      - name: Upload Phase-0 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase0-reference
          path: micro-clang-phase0-evidence/
          if-no-files-found: error
          retention-days: 14

  phase1-build:
    name: Phase 1 source build
    needs: phase0-reference
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install UCRT source-build environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            make
            diffutils
            patch
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Build X86-only Clang/LLD plus source-matched MinGW/UCRT runtime
        shell: msys2 {0}
        run: |
          ./scripts/micro-clang-jit/build-source-toolchain.sh "$PWD/micro-clang-build" "$PWD/micro-clang-stage" "$PWD/micro-clang-build-evidence"

      - name: Upload source-built toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase1-toolchain
          path: micro-clang-stage/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Upload source-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase1-build-evidence
          path: micro-clang-build-evidence/
          if-no-files-found: warn
          retention-days: 14

  phase1-private-proof:
    name: Phase 1 private proof (Python ${{ matrix.python }})
    needs: [phase0-reference, phase1-build]
    runs-on: windows-2022
    timeout-minutes: 75
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            experimental: false
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: false
          - python: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download source-built toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase1-toolchain
          path: micro-clang-artifact

      - name: Download Phase-0 reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase0-reference
          path: micro-clang-phase0-reference

      - name: Install isolated FEniCS runtime
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-proof
          create-args: >-
            --override-channels --strict-channel-priority
            -c precise-simulation -c conda-forge
            python=${{ matrix.python }}
            libblas=*=*openblas
            fenics-dolfinx
            cffi
            setuptools
            pefile

      - name: Run private CFFI/FFCx proof with the production backend disabled
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/micro-clang-proof"
          $compiler = Get-ChildItem "micro-clang-artifact" -Recurse -Filter "x86_64-w64-mingw32-clang.exe" -File | Select-Object -First 1
          if (-not $compiler) { throw "source-built target clang not found in downloaded artifact" }
          $sourceRoot = Split-Path -Parent (Split-Path -Parent $compiler.FullName)
          $toolchain = Join-Path $PWD "micro clang toolchain py${{ matrix.python }} with spaces"
          Copy-Item -Recurse -Force $sourceRoot $toolchain
          $reference = (Resolve-Path "micro-clang-phase0-reference/driver-evidence.json").Path
          ./scripts/micro-clang-jit/run-phase1.ps1 -PythonPrefix $prefix -ToolchainRoot $toolchain -ReferenceDriver $reference -WorkDir "micro clang proof py${{ matrix.python }} with spaces" -DiagnosticsDir "micro-clang-phase1-py${{ matrix.python }}"

      - name: Upload Phase-1 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase1-py${{ matrix.python }}
          path: |
            micro-clang-phase1-py${{ matrix.python }}/
            micro clang proof py${{ matrix.python }} with spaces/
          if-no-files-found: warn
          retention-days: 14


  phase2-package:
    name: Phase 2 conservative package
    needs: [phase0-reference, phase1-build, phase1-private-proof]
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download source-built toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase1-toolchain
          path: micro-clang-artifact

      - name: Download source-build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase1-build-evidence
          path: micro-clang-build-evidence

      - name: Install Phase-2 package-test environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase2
          create-args: >-
            -c conda-forge
            python=3.12
            pefile

      - name: Stage conservative backend package and verify relocation
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/micro-clang-phase2"
          $compiler = Get-ChildItem "micro-clang-artifact" -Recurse -Filter "x86_64-w64-mingw32-clang.exe" -File | Select-Object -First 1
          if (-not $compiler) { throw "source-built target clang not found in downloaded artifact" }
          $sourceRoot = Split-Path -Parent (Split-Path -Parent $compiler.FullName)
          $packageRoot = Join-Path $PWD "micro clang phase2 package with spaces"
          $evidence = Join-Path $PWD "micro-clang-phase2-evidence"
          ./scripts/micro-clang-jit/package-phase2.ps1 -ToolchainRoot $sourceRoot -PythonPrefix $prefix -BuildEvidenceDir (Join-Path $PWD "micro-clang-build-evidence") -OutputRoot $packageRoot -EvidenceDir $evidence
          $backendRoot = Join-Path $packageRoot "Library/fenics-jit/backends/micro-clang"
          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase2-package-smoke.py --backend-root $backendRoot --work-dir (Join-Path $PWD "micro clang phase2 smoke with spaces") --evidence-dir $evidence
          if ($LASTEXITCODE -ne 0) { throw "Phase-2 conservative package smoke failed" }

          # Reconstruct the same package from the immutable Phase-1 inputs under
          # an independent clean root. Phase 3 remains gated until this proves
          # the retained manifest, final size metadata and package metadata are
          # deterministic and the reconstructed package is relocatable.
          $reproRoot = Join-Path $PWD "micro clang phase2 reproducibility root with spaces"
          $reproEvidence = Join-Path $PWD "micro-clang-phase2-repro-evidence"
          ./scripts/micro-clang-jit/package-phase2.ps1 -ToolchainRoot $sourceRoot -PythonPrefix $prefix -BuildEvidenceDir (Join-Path $PWD "micro-clang-build-evidence") -OutputRoot $reproRoot -EvidenceDir $reproEvidence
          $reproBackend = Join-Path $reproRoot "Library/fenics-jit/backends/micro-clang"

          $comparisons = [ordered]@{}
          foreach ($name in @("metadata.json", "manifest.csv", "size.txt")) {
            $first = (Get-FileHash -LiteralPath (Join-Path $backendRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $second = (Get-FileHash -LiteralPath (Join-Path $reproBackend $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $comparisons[$name] = [ordered]@{
              first_sha256 = $first
              second_sha256 = $second
              match = ($first -eq $second)
            }
            if ($first -ne $second) {
              throw "Phase-2 reproducibility mismatch for $name"
            }
          }

          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase2-package-smoke.py --backend-root $reproBackend --work-dir (Join-Path $PWD "micro clang phase2 reproducibility smoke with spaces") --evidence-dir $reproEvidence
          if ($LASTEXITCODE -ne 0) { throw "Phase-2 reconstructed package relocation smoke failed" }

          $repro = [ordered]@{
            schema = "fenics-jit-micro-clang-phase2-reproducibility-v1"
            status = "pass"
            clean_root_rebuild = $true
            source_inputs_shared = $true
            comparisons = $comparisons
            reconstructed_relocation_smoke = "pass"
            production_selector_integrated = $false
          }
          [IO.File]::WriteAllText(
            (Join-Path $evidence "phase2-reproducibility.json"),
            ($repro | ConvertTo-Json -Depth 8) + [Environment]::NewLine,
            (New-Object Text.UTF8Encoding($false))
          )
          Copy-Item -LiteralPath (Join-Path $reproEvidence "phase2-smoke.json") -Destination (Join-Path $evidence "phase2-repro-smoke.json") -Force

      - name: Upload Phase-2 conservative package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase2-package
          path: micro clang phase2 package with spaces/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload Phase-2 package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase2-evidence
          path: micro-clang-phase2-evidence/
          if-no-files-found: warn
          retention-days: 14


  phase3-private:
    name: Phase 3 private broad qualification (Python ${{ matrix.python }})
    needs: [phase0-reference, phase2-package]
    runs-on: windows-2022
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            experimental: false
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: false
          - python: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download qualified Phase-2 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase2-package
          path: micro clang phase3 package artifact with spaces

      - name: Download Phase-0 reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase0-reference
          path: micro-clang-phase0-reference

      - name: Install micromamba bootstrap
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase3-bootstrap
          create-args: >-
            -c conda-forge
            python=3.12

      - name: Install isolated FEniCS runtime in a spaced prefix
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase3 python py${{ matrix.python }} with spaces"
          & $env:MAMBA_EXE create -y -p $prefix --override-channels --strict-channel-priority -c precise-simulation -c conda-forge "python=${{ matrix.python }}" "libblas=*=*openblas" fenics-jit-llvm-mingw fenics-dolfinx cffi setuptools pefile
          if ($LASTEXITCODE -ne 0) { throw "Phase-3 FEniCS environment installation failed" }

          $artifactBackend = Join-Path $PWD "micro clang phase3 package artifact with spaces\Library\fenics-jit\backends\micro-clang"
          if (-not (Test-Path -LiteralPath $artifactBackend -PathType Container)) {
            throw "qualified Phase-2 backend artifact is missing: $artifactBackend"
          }
          $backendParent = Join-Path $prefix "Library\fenics-jit\backends"
          $backend = Join-Path $backendParent "micro-clang"
          New-Item -ItemType Directory -Force $backendParent | Out-Null
          Remove-Item -Recurse -Force $backend -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $artifactBackend -Destination $backend -Recurse -Force

      - name: Re-run ABI, driver, PE and hermeticity contract against installed package
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase3 python py${{ matrix.python }} with spaces"
          $backend = Join-Path $prefix "Library\fenics-jit\backends\micro-clang"
          $reference = (Resolve-Path "micro-clang-phase0-reference/driver-evidence.json").Path
          ./scripts/micro-clang-jit/run-phase1.ps1 -PythonPrefix $prefix -ToolchainRoot $backend -ReferenceDriver $reference -WorkDir "micro clang phase3 contract py${{ matrix.python }} with spaces" -DiagnosticsDir "micro-clang-phase3-py${{ matrix.python }}/phase1-regression"

      - name: Run private broad qualification without selector integration
        shell: pwsh
        run: |
          $prefix = Join-Path $PWD "micro clang phase3 python py${{ matrix.python }} with spaces"
          $backend = Join-Path $prefix "Library\fenics-jit\backends\micro-clang"
          $env:PYTHONHASHSEED = "0"
          # This prefix is created manually rather than activated by setup-micromamba.
          # Put its runtime DLL directories on PATH before importing mpi4py, matching
          # the qualified Windows DOLFINx/MPI test environment.
          $env:PATH = "$prefix;$prefix\Scripts;$prefix\Library\bin;$env:PATH"
          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase3-private-validation.py --backend-root $backend --work-dir "micro clang phase3 work py${{ matrix.python }} with spaces" --diagnostics-dir "micro-clang-phase3-py${{ matrix.python }}"
          if ($LASTEXITCODE -ne 0) { throw "Phase-3 private broad qualification failed" }

      - name: Upload Phase-3 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase3-py${{ matrix.python }}
          path: micro-clang-phase3-py${{ matrix.python }}/
          if-no-files-found: warn
          retention-days: 14


  phase4-build:
    name: Phase 4 stage 1 minimized host build
    needs: phase3-private
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install UCRT source-build environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            unzip
            make
            diffutils
            patch
            autoconf
            automake
            libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Build size-optimized host compiler with conservative target sysroot
        shell: msys2 {0}
        run: |
          export MICRO_CLANG_BUILD_PROFILE=phase4-host-min
          ./scripts/micro-clang-jit/build-source-toolchain.sh "$PWD/micro-clang-phase4-build" "$PWD/micro-clang-phase4-stage" "$PWD/micro-clang-phase4-build-evidence"

      - name: Upload Phase-4 stage-1 toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage1-toolchain
          path: micro-clang-phase4-stage/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      - name: Upload Phase-4 build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: micro-clang-phase4-stage1-build-evidence
          path: micro-clang-phase4-build-evidence/
          if-no-files-found: warn
          retention-days: 14


  phase4-package:
    name: Phase 4 stage 1 measured package
    needs: [phase2-package, phase4-build]
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Phase-4 minimized toolchain
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase4-stage1-toolchain
          path: micro-clang-phase4-artifact

      - name: Download Phase-4 build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase4-stage1-build-evidence
          path: micro-clang-phase4-build-evidence

      - name: Download conservative Phase-2 evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: micro-clang-phase2-evidence
          path: micro-clang-phase2-evidence

      - name: Install Phase-4 package-test environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: micro-clang-phase4
          create-args: >-
            -c conda-forge
            python=3.12
            pefile

      - name: Package, measure and reproduce Phase-4 stage 1
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs/micro-clang-phase4"
          $compiler = Get-ChildItem "micro-clang-phase4-artifact" -Recurse -Filter "x86_64-w64-mingw32-clang.exe" -File | Select-Object -First 1
          if (-not $compiler) { throw "Phase-4 target clang not found in downloaded artifact" }
          $sourceRoot = Split-Path -Parent (Split-Path -Parent $compiler.FullName)
          $packageRoot = Join-Path $PWD "micro clang phase4 stage1 package with spaces"
          $evidence = Join-Path $PWD "micro-clang-phase4-stage1-evidence"
          ./scripts/micro-clang-jit/package-phase2.ps1 -ToolchainRoot $sourceRoot -PythonPrefix $prefix -BuildEvidenceDir (Join-Path $PWD "micro-clang-phase4-build-evidence") -OutputRoot $packageRoot -EvidenceDir $evidence -Phase 4
          $backendRoot = Join-Path $packageRoot "Library/fenics-jit/backends/micro-clang"
          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase2-package-smoke.py --backend-root $backendRoot --work-dir (Join-Path $PWD "micro clang phase4 smoke with spaces") --evidence-dir $evidence --expected-phase 4
          if ($LASTEXITCODE -ne 0) { throw "Phase-4 stage-1 package smoke failed" }

          $reproRoot = Join-Path $PWD "micro clang phase4 stage1 reproducibility root with spaces"
          $reproEvidence = Join-Path $PWD "micro-clang-phase4-stage1-repro-evidence"
          ./scripts/micro-clang-jit/package-phase2.ps1 -ToolchainRoot $sourceRoot -PythonPrefix $prefix -BuildEvidenceDir (Join-Path $PWD "micro-clang-phase4-build-evidence") -OutputRoot $reproRoot -EvidenceDir $reproEvidence -Phase 4
          $reproBackend = Join-Path $reproRoot "Library/fenics-jit/backends/micro-clang"

          $comparisons = [ordered]@{}
          foreach ($name in @("metadata.json", "manifest.csv", "size.txt")) {
            $first = (Get-FileHash -LiteralPath (Join-Path $backendRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $second = (Get-FileHash -LiteralPath (Join-Path $reproBackend $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $comparisons[$name] = [ordered]@{ first_sha256 = $first; second_sha256 = $second; match = ($first -eq $second) }
            if ($first -ne $second) { throw "Phase-4 stage-1 reproducibility mismatch for $name" }
          }

          & (Join-Path $prefix "python.exe") ./scripts/micro-clang-jit/phase2-package-smoke.py --backend-root $reproBackend --work-dir (Join-Path $PWD "micro clang phase4 reproducibility smoke with spaces") --evidence-dir $reproEvidence --expected-phase 4
          if ($LASTEXITCODE -ne 0) { throw "Phase-4 reconstructed package relocation smoke failed" }

          $baseline = Get-Content "micro-clang-phase2-evidence/phase2-package-summary.json" -Raw | ConvertFrom-Json
          $candidate = Get-Content (Join-Path $evidence "phase4-package-summary.json") -Raw | ConvertFrom-Json
          $removed = [int64]$baseline.payload_bytes - [int64]$candidate.payload_bytes
          $reduction = [ordered]@{
            schema = "fenics-jit-micro-clang-phase4-stage1-reduction-v1"
            status = "qualified-for-private-matrix"
            reduction = "MinSizeRel host compiler; Clang component linkage without libclang-cpp; remove host development/tooling artifacts"
            target_sysroot_policy = "unchanged conservative Phase-2 sysroot"
            baseline_bytes = [int64]$baseline.payload_bytes
            candidate_bytes = [int64]$candidate.payload_bytes
            bytes_removed = $removed
            percent_removed = [math]::Round(100.0 * $removed / [double]$baseline.payload_bytes, 3)
            candidate_mib = [double]$candidate.payload_mib
            early_gate_mib = 108.2
            early_gate_status = [string]$candidate.phase4_size_gate_status
            reproducibility = $comparisons
            production_selector_integrated = $false
          }
          [IO.File]::WriteAllText(
            (Join-Path $evidence "phase4-stage1-reduction.json"),
            ($reduction | ConvertTo-Json -Depth 8) + [Environment]::NewLine,
            (New-Object Text.UTF8Encoding($false))
          )
          Copy-Item -LiteralPath (Join-Path $reproEvidence "phase4-smoke.json") -Destination (Join-Path $evidence "phase4-repro-smoke.json") -Force

      - name: Upload Phase-4 stage-1 package
