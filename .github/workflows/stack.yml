name: stack

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every stage even if versions are unchanged"
        type: boolean
        default: false
      upload:
        description: "Publish resulting packages to anaconda.org"
        type: boolean
        default: true
  pull_request:
    paths:
      - "recipes/**"
      - "scripts/build-stack.ps1"
      - "scripts/check_versions.py"
      - "scripts/test_check_versions.py"
      - "scripts/test-python-abi3.ps1"
      - ".github/workflows/stack.yml"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "scripts/build-stack.ps1"
      - "scripts/check_versions.py"
      - "scripts/test_check_versions.py"
      - "scripts/test-python-abi3.ps1"
      - ".github/workflows/stack.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('stack-pr-{0}', github.event.pull_request.number) || 'stack-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      FORCE_ALL: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || inputs.force_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build tooling
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-url: https://github.com/mamba-org/micromamba-releases/releases/download/2.9.0-0/micromamba-win-64
          environment-name: ci
          create-args: >-
            -c conda-forge
            python=3.12
            rattler-build=0.74.0
            anaconda-client=1.14.1
          cache-environment: true
          cache-environment-key: ci-${{ hashFiles('.github/workflows/stack.yml') }}

      - name: Put ci env on PATH
        shell: pwsh
        run: |
          "$env:MAMBA_ROOT_PREFIX/envs/ci" >> $env:GITHUB_PATH
          "$env:MAMBA_ROOT_PREFIX/envs/ci/Library/bin" >> $env:GITHUB_PATH
          "$env:MAMBA_ROOT_PREFIX/envs/ci/Scripts" >> $env:GITHUB_PATH

      - name: Validate build scripts
        shell: pwsh
        run: |
          python -m py_compile scripts/check_versions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $parseErrors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors) {
              foreach ($error in $errors) {
                $parseErrors += "$($_.Name):$($error.Extent.StartLineNumber): $($error.Message)"
              }
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed"
          }

      - name: Resolve reference and decide what to rebuild
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $micromamba = if ($env:MAMBA_EXE) { $env:MAMBA_EXE } else { "micromamba" }
          python scripts/check_versions.py --micromamba $micromamba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content plan.json

      - name: Build changed stages
        shell: pwsh
        run: scripts/build-stack.ps1 -PlanFile plan.json

      - name: Test ABI3 on supported Python versions
        shell: pwsh
        run: scripts/test-python-abi3.ps1

      - name: Preview ABI3 on Python 3.15
        shell: pwsh
        run: scripts/test-python-abi3.ps1 -Preview
        continue-on-error: true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics
          path: |
            build-logs/
            plan.json
            recipes/*/recipe.yaml
            recipes/*/variants-win64.yaml
            scripts/build-stack.ps1
            scripts/check_versions.py
          if-no-files-found: warn
          retention-days: 14
        continue-on-error: true

      - name: Upload to precise-simulation
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.upload }}
        shell: pwsh
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if (-not (Test-Path "output/win-64")) {
            Write-Host "Nothing to upload - no stages were rebuilt."
          } else {
            Get-ChildItem output/win-64 -Filter *.conda | ForEach-Object {
              Write-Host "== uploading $($_.Name) =="
              anaconda upload --force --user precise-simulation $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "upload failed: $($_.Name)" }
            }
          }
