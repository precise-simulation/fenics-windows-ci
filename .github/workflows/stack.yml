name: stack

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild every stage even if versions are unchanged"
        type: boolean
        default: false
      upload:
        description: "Publish resulting packages to anaconda.org"
        type: boolean
        default: true

concurrency:
  group: stack-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
      FORCE_ALL: ${{ inputs.force_all }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tooling (rattler-build, anaconda-client)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ci
          create-args: >-
            -c conda-forge
            rattler-build=0.74.*
            anaconda-client
          cache-environment: true
          cache-environment-key: ci-${{ hashFiles('.github/workflows/stack.yml') }}

      - name: Put ci env on PATH
        shell: pwsh
        run: |
          "$env:MAMBA_ROOT_PREFIX/envs/ci" >> $env:GITHUB_PATH
          "$env:MAMBA_ROOT_PREFIX/envs/ci/Library/bin" >> $env:GITHUB_PATH
          "$env:MAMMA_ROOT_PREFIX/envs/ci/Scripts" >> $env:GITHUB_PATH

      - name: Decide what to rebuild
        shell: pwsh
        run: |
          python scripts/check_versions.py
          Get-Content plan.json

      - name: Build changed stages
        shell: pwsh
        run: scripts/build-stack.ps1 -PlanFile plan.json

      - name: Collect build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            output/bld/**/work/arch-*/lib/petsc/conf/*.log
            output/bld/**/work/build/CMakeFiles/CMakeConfigureLog.yaml
            output/bld/**/*.log
          if-no-files-found: ignore
        continue-on-error: true

      - name: Upload to precise-simulation
        if: ${{ inputs.upload != false }}
        shell: pwsh
        run: |
          Get-ChildItem output/win-64 -Filter *.conda | ForEach-Object {
            Write-Host "== uploading $($_.Name) =="
            anaconda upload --user precise-simulation $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($_.Name)" }
          }
