name: embedded-runtime-macos-overlay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/embedded-runtime-macos-overlay.yml"
      - "scripts/macos-package-lock.py"
      - "scripts/package-macos-embedded-runtime.py"
      - "scripts/fenics-embed-bootstrap-macos.py"
      - "scripts/test-macos-embedded-runtime-consumer.sh"
      - "scripts/test-poisson.py"
      - "specs/bridge-embed-runtime/locks/macos-arm64-package-lock.json"
      - "specs/bridge-embed-runtime/locks/macos-x86_64-package-lock.json"
      - "specs/bridge-embed-runtime/locks/macos-arm64-explicit.txt"
      - "specs/bridge-embed-runtime/locks/macos-x86_64-explicit.txt"

permissions:
  contents: read

concurrency:
  group: embedded-runtime-macos-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-overlay:
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            conda_subdir: osx-arm64
            consumer_host_mode: native
            zig_version: 0.15.2
            zig_asset: zig-aarch64-macos-0.15.2.tar.xz
            zig_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
            zig_native_host_asset: ''
            zig_native_host_sha256: ''
            overlay_asset: fenics-embed-runtime-v0.1.0-macos-arm64-cp312.zip
          - architecture: x86_64
            conda_subdir: osx-64
            consumer_host_mode: rosetta
            zig_version: 0.15.2
            zig_asset: zig-x86_64-macos-0.15.2.tar.xz
            zig_sha256: 375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f
            zig_native_host_asset: zig-aarch64-macos-0.15.2.tar.xz
            zig_native_host_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
            overlay_asset: fenics-embed-runtime-v0.1.0-macos-x64-cp312.zip
    env:
      TARGET_ARCH: ${{ matrix.architecture }}
      TARGET_SUBDIR: ${{ matrix.conda_subdir }}
      CONSUMER_HOST_MODE: ${{ matrix.consumer_host_mode }}
      ZIG_VERSION: ${{ matrix.zig_version }}
      ZIG_ASSET: ${{ matrix.zig_asset }}
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
      ZIG_NATIVE_HOST_ASSET: ${{ matrix.zig_native_host_asset }}
      ZIG_NATIVE_HOST_SHA256: ${{ matrix.zig_native_host_sha256 }}
      OVERLAY_ASSET: ${{ matrix.overlay_asset }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Provision Rosetta 2 for x86_64
        if: matrix.architecture == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sudo softwareupdate --install-rosetta --agree-to-license >"$RUNNER_TEMP/rosetta-install.log" 2>&1 || {
            cat "$RUNNER_TEMP/rosetta-install.log" >&2
            /usr/bin/arch -x86_64 /usr/bin/uname -m >/dev/null 2>&1 || exit 1
          }
          test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = x86_64

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          # setup-micromamba requires the release tag form; this tag installs
          # micromamba/libmamba 2.10.0, matching prototype run 41294435601.
          micromamba-version: '2.10.0-0'

      - name: Replay immutable package lock without solving
        shell: bash
        run: |
          set -euo pipefail
          lock="specs/bridge-embed-runtime/locks/macos-${TARGET_ARCH}-package-lock.json"
          source_explicit="specs/bridge-embed-runtime/locks/macos-${TARGET_ARCH}-explicit.txt"
          explicit="$RUNNER_TEMP/fenics-macos-${TARGET_ARCH}-explicit.txt"
          prefix="$RUNNER_TEMP/fenics-macos-locked-${TARGET_ARCH}"
          package_cache="$MAMBA_ROOT_PREFIX/pkgs"
          evidence="build/macos-overlay-${TARGET_ARCH}"
          mkdir -p "$evidence"
          rm -rf "$prefix"

          {
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            echo "runner_arch=$(uname -m)"
            sw_vers
            xcodebuild -version
            clang --version
            xcrun --show-sdk-path
            xcrun --show-sdk-version
          } > "$evidence/host-toolchain.txt"

          python3 scripts/macos-package-lock.py explicit \
            --lock "$lock" \
            --source-explicit "$source_explicit" \
            --arch "$TARGET_ARCH" \
            --output "$explicit" \
            | tee "$evidence/package-lock-render.log"
          cp "$explicit" "$evidence/locked-explicit.txt"

          # @EXPLICIT contains exact package URLs + SHA-256 fragments.  No
          # channel, matchspec or dependency solve participates here.
          CONDA_SUBDIR="$TARGET_SUBDIR" "$MAMBA_EXE" create -y \
            -p "$prefix" \
            --file "$explicit" \
            2>&1 | tee "$evidence/package-lock-replay.log"

          python3 scripts/macos-package-lock.py verify-prefix \
            --lock "$lock" \
            --arch "$TARGET_ARCH" \
            --prefix "$prefix" \
            --package-cache "$package_cache" \
            --evidence "$evidence/package-lock-verification.json" \
            | tee "$evidence/package-lock-verification.log"

          echo "FENICS_LOCK_FILE=$lock" >> "$GITHUB_ENV"
          echo "FENICS_LOCKED_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "FENICS_PACKAGE_CACHE=$package_cache" >> "$GITHUB_ENV"
          echo "FENICS_OVERLAY_EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Fetch pinned Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$ZIG_ASSET"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://ziglang.org/download/$ZIG_VERSION/$ZIG_ASSET"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$ZIG_SHA256"
          root="$RUNNER_TEMP/fenics-zig-$TARGET_ARCH"
          rm -rf "$root"
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root" --strip-components=1
          test -x "$root/zig"
          test -f "$root/LICENSE"
          printf '%s  %s\n' "$actual" "$ZIG_ASSET" > "$FENICS_OVERLAY_EVIDENCE/zig-sha256.txt"
          echo "FENICS_ZIG_ROOT=$root" >> "$GITHUB_ENV"
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            host_archive="$RUNNER_TEMP/$ZIG_NATIVE_HOST_ASSET"
            curl --fail --location --retry 3 --retry-all-errors \
              --output "$host_archive" \
              "https://ziglang.org/download/$ZIG_VERSION/$ZIG_NATIVE_HOST_ASSET"
            host_actual="$(shasum -a 256 "$host_archive" | awk '{print $1}')"
            test "$host_actual" = "$ZIG_NATIVE_HOST_SHA256"
            host_root="$RUNNER_TEMP/fenics-zig-native-host-arm64"
            rm -rf "$host_root"
            mkdir -p "$host_root"
            tar -xJf "$host_archive" -C "$host_root" --strip-components=1
            test -x "$host_root/zig"
            test -f "$host_root/LICENSE"
            /usr/bin/file "$host_root/zig" | grep -q arm64
            printf '%s  %s\n' "$host_actual" "$ZIG_NATIVE_HOST_ASSET" \
              >> "$FENICS_OVERLAY_EVIDENCE/zig-sha256.txt"
            echo "FENICS_ZIG_NATIVE_HOST_ROOT=$host_root" >> "$GITHUB_ENV"
          fi

      - name: Package relocatable macOS overlay
        shell: bash
        run: |
          set -euo pipefail
          producer_revision="$(git rev-parse HEAD)"
          mkdir -p dist
          packager_args=(
            --prefix "$FENICS_LOCKED_PREFIX"
            --lock "$FENICS_LOCK_FILE"
            --package-cache "$FENICS_PACKAGE_CACHE"
            --zig-root "$FENICS_ZIG_ROOT"
            --zig-version "$ZIG_VERSION"
            --zig-archive "$ZIG_ASSET"
            --zig-sha256 "$ZIG_SHA256"
          )
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            packager_args+=(
              --zig-native-host-root "$FENICS_ZIG_NATIVE_HOST_ROOT"
              --zig-native-host-archive "$ZIG_NATIVE_HOST_ASSET"
              --zig-native-host-sha256 "$ZIG_NATIVE_HOST_SHA256"
            )
          fi
          python3 scripts/package-macos-embedded-runtime.py \
            "${packager_args[@]}" \
            --arch "$TARGET_ARCH" \
            --output dist \
            --version 0.1.0 \
            --producer-revision "$producer_revision" \
            2>&1 | tee "$FENICS_OVERLAY_EVIDENCE/package-overlay.log"
          test -f "dist/$OVERLAY_ASSET"
          test -f "dist/$OVERLAY_ASSET.json"
          test -f "dist/$OVERLAY_ASSET.sha256"

      - name: Rebuild overlay and prove deterministic identity
        shell: bash
        run: |
          set -euo pipefail
          producer_revision="$(git rev-parse HEAD)"
          mkdir -p dist-repeat
          packager_args=(
            --prefix "$FENICS_LOCKED_PREFIX"
            --lock "$FENICS_LOCK_FILE"
            --package-cache "$FENICS_PACKAGE_CACHE"
            --zig-root "$FENICS_ZIG_ROOT"
            --zig-version "$ZIG_VERSION"
            --zig-archive "$ZIG_ASSET"
            --zig-sha256 "$ZIG_SHA256"
          )
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            packager_args+=(
              --zig-native-host-root "$FENICS_ZIG_NATIVE_HOST_ROOT"
              --zig-native-host-archive "$ZIG_NATIVE_HOST_ASSET"
              --zig-native-host-sha256 "$ZIG_NATIVE_HOST_SHA256"
            )
          fi
          python3 scripts/package-macos-embedded-runtime.py \
            "${packager_args[@]}" \
            --arch "$TARGET_ARCH" \
            --output dist-repeat \
            --version 0.1.0 \
            --producer-revision "$producer_revision" \
            > "$FENICS_OVERLAY_EVIDENCE/package-overlay-repeat.log"
          cmp "dist/$OVERLAY_ASSET" "dist-repeat/$OVERLAY_ASSET"
          cmp "dist/$OVERLAY_ASSET.json" "dist-repeat/$OVERLAY_ASSET.json"
          cmp "dist/$OVERLAY_ASSET.sha256" "dist-repeat/$OVERLAY_ASSET.sha256"
          echo "deterministic_overlay_rebuild=pass" \
            > "$FENICS_OVERLAY_EVIDENCE/deterministic-rebuild.txt"

      - name: Audit packaged ZIP structure
        shell: bash
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/fenics overlay audit $TARGET_ARCH"
          rm -rf "$audit_root"
          mkdir -p "$audit_root"
          unzip -t "dist/$OVERLAY_ASSET" \
            | tee "$FENICS_OVERLAY_EVIDENCE/zip-integrity.log"
          ditto -x -k "dist/$OVERLAY_ASSET" "$audit_root"
          python3 -m py_compile \
            "$audit_root/Python.framework/Versions/3.12/lib/python3.12/site-packages/fenics_embed_runtime.py"
          test -x "$audit_root/fenics-runtime/zig/zig"
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            test -x "$audit_root/fenics-runtime/zig-native-arm64/zig"
            /usr/bin/file "$audit_root/fenics-runtime/zig-native-arm64/zig" | grep -q arm64
          fi
          if find "$audit_root" -type f -o -type l | sed "s#^$audit_root/##" \
              | grep -E '^fenics-runtime/conda/lib/python3\.12/site-packages/(numpy/|numpy\.libs/|numpy-[^/]+\.dist-info/)'; then
            echo "producer-owned NumPy path found in overlay" >&2
            exit 1
          fi
          python3 - "dist/$OVERLAY_ASSET" "dist/$OVERLAY_ASSET.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          summary = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if summary.get("artifact") != archive.name or summary.get("sha256") != actual:
              raise SystemExit("outer summary does not bind the packaged ZIP")
          print(f"overlay_sha256={actual}")
          print("packaged_zip_structure=pass")
          PY

      - name: Remove producer source environments after packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FENICS_LOCKED_PREFIX" "$FENICS_PACKAGE_CACHE" "$FENICS_ZIG_ROOT"
          test ! -e "$FENICS_LOCKED_PREFIX"
          test ! -e "$FENICS_PACKAGE_CACHE"
          test ! -e "$FENICS_ZIG_ROOT"
          if [[ "$TARGET_ARCH" == x86_64 ]]; then
            rm -rf "$FENICS_ZIG_NATIVE_HOST_ROOT"
            test ! -e "$FENICS_ZIG_NATIVE_HOST_ROOT"
          fi

      - name: Qualify overlay in clean public consumer runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-macos-embedded-runtime-consumer.sh \
            "dist/$OVERLAY_ASSET" \
            "$TARGET_ARCH" \
            "$FENICS_OVERLAY_EVIDENCE/consumer" \
            "$CONSUMER_HOST_MODE"

      - name: Collect immutable handoff evidence
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/$OVERLAY_ASSET" "$FENICS_OVERLAY_EVIDENCE/"
          cp "dist/$OVERLAY_ASSET.json" "$FENICS_OVERLAY_EVIDENCE/"
          cp "dist/$OVERLAY_ASSET.sha256" "$FENICS_OVERLAY_EVIDENCE/"
          unzip -p "dist/$OVERLAY_ASSET" fenics-embed-manifest.json \
            > "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json"
          unzip -p "dist/$OVERLAY_ASSET" fenics-runtime/provenance/native-census.json \
            > "$FENICS_OVERLAY_EVIDENCE/native-census.json"
          unzip -p "dist/$OVERLAY_ASSET" fenics-runtime/provenance/third-party-licenses.json \
            > "$FENICS_OVERLAY_EVIDENCE/third-party-licenses.json"
          shasum -a 256 \
            "$FENICS_OVERLAY_EVIDENCE/fenics-embed-manifest.json" \
            "$FENICS_OVERLAY_EVIDENCE/native-census.json" \
            "$FENICS_OVERLAY_EVIDENCE/third-party-licenses.json" \
            > "$FENICS_OVERLAY_EVIDENCE/overlay-evidence-sha256.txt"
          python3 - "$FENICS_OVERLAY_EVIDENCE" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = root / "top-level-sha256.txt"
          lines = []
          for path in sorted(root.iterdir()):
              if path == output or not path.is_file():
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          output.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload macOS overlay qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fenics-macos-overlay-${{ matrix.architecture }}
          path: build/macos-overlay-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          find "build/macos-overlay-${TARGET_ARCH}" -maxdepth 3 -type f -print 2>/dev/null | sort
          while IFS= read -r log; do
            echo "===== $log ====="
            tail -n 250 "$log"
          done < <(find "build/macos-overlay-${TARGET_ARCH}" -type f -name '*.log' -print 2>/dev/null | sort)
